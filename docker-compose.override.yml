services:
  api:
    build:
      target: dev
    image: mis_gastos-api:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./app/backend/src:/app/src
    command: npm run dev

  # En local no hay dominio ni certificado: el proxy solo se usa en producción.
  caddy:
    profiles: [production-only]
