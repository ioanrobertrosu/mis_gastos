# Producción: docker compose -f docker-compose.yml up -d
# Desarrollo: docker compose up (aplica docker-compose.override.yml)
services:
  api:
    build:
      context: ./app/backend
      target: runtime
    image: mis_gastos-api
    container_name: mis_gastos_api
    restart: unless-stopped
    env_file:
      - path: ./app/backend/.env
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Solo local: sin TLS, los JWT viajarían en claro. Se expone a través de un proxy inverso.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal_network

  # Proxy inverso con TLS automático (Let's Encrypt). Único servicio expuesto a Internet.
  caddy:
    image: caddy:2.10
    container_name: mis_gastos_caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:-mis-gastos.duckdns.org}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y claves: deben sobrevivir a los reinicios (Let's Encrypt limita las emisiones).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_network

volumes:
  caddy_data:
  caddy_config:

networks:
  internal_network:
    driver: bridge
