# Producción: docker compose -f docker-compose.yml up -d
# Desarrollo: docker compose up (aplica docker-compose.override.yml)
services:
  api:
    build:
      context: ./app/backend
      target: runtime
    image: mis_gastos-api
    container_name: mis_gastos_api
    restart: unless-stopped
    env_file:
      - path: ./app/backend/.env
        required: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Solo local: sin TLS, los JWT viajarían en claro. Se expone a través de un proxy inverso.
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge
